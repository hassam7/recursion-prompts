    <link rel="stylesheet" href="/src/app.css" />
    <link rel="stylesheet" href="/src/header-view.css" />
    <link rel="stylesheet" href="/src/sidebar-view.css" />
    <link rel="stylesheet" href="/src/editor-view.css" />
    <link rel="stylesheet" href="/src/results-view.css" />
    <link rel="stylesheet" href="/src/overlay-view.css" />
  </head>
  <body>
    <!-- Loading overlay -->
    <div id="loading-overlay">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading problems…</div>
    </div>

    <div class="app">
      <!-- ── Header ─────────────────────────────────────────────────── -->
      <header>
        <button
          class="problems-menu-btn"
          id="problems-menu-btn"
          type="button"
          aria-label="Open problems menu"
          aria-controls="problems-sidebar"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="logo">
          <div class="logo-icon">🔁</div>
          Practice Recursion
        </div>

        <div class="header-center">
          <button class="nav-btn" id="prev-btn" disabled>← Prev</button>
          <div class="problem-badge">
            Problem <span id="current-num">1</span> /
            <span id="total-num">40</span>
          </div>
          <button class="nav-btn" id="next-btn">Next →</button>
        </div>

        <button class="run-btn" id="run-btn">
          <div class="spinner"></div>
          <span class="run-label">▶ Run Tests</span>
        </button>
      </header>

      <!-- ── Sidebar ─────────────────────────────────────────────────── -->
      <aside class="sidebar" id="problems-sidebar">
        <div class="sidebar-header">All Problems</div>
        <div class="sidebar-search">
          <input type="text" id="search-input" placeholder="Search problems…" />
        </div>
        <div class="sidebar-list" id="sidebar-list"></div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- ── Editor ─────────────────────────────────────────────────── -->
      <main class="editor-panel">
        <div class="problem-header">
          <div class="problem-title" id="problem-title">Loading…</div>
          <div class="problem-meta">
            <span class="meta-tag">Recursion</span>
            <span class="meta-tag" id="problem-part-tag">Part 1</span>
          </div>
        </div>

        <div class="editor-toolbar">
          <span class="toolbar-label">Solution</span>
          <div class="toolbar-actions">
            <a
              class="github-edit-btn"
              id="github-edit-btn"
              href="https://github.com/hassam7/recursion-prompts"
              target="_blank"
              rel="noopener noreferrer"
              title="Edit this problem &amp; its test cases on GitHub"
            >✎ Edit on GitHub</a>
            <button class="reset-btn" id="reset-btn">↺ Reset to stub</button>
          </div>
        </div>

        <div class="editor-wrapper">
          <div id="code-editor"></div>
        </div>
      </main>

      <!-- ── Results ─────────────────────────────────────────────────── -->
      <aside class="results-panel">
        <div class="results-header">
          <div class="results-title">Test Results</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="stats-row">
            <div class="stat">
              Pass: <span class="pass-count" id="stat-pass">–</span>
            </div>
            <div class="stat">
              Fail: <span class="fail-count" id="stat-fail">–</span>
            </div>
            <div class="stat">
              Total: <span class="total-count" id="stat-total">–</span>
            </div>
          </div>
        </div>

        <div class="results-body" id="results-body">
          <div class="idle-state">
            <div class="idle-icon">🧪</div>
            <div>
              Write your solution and click<br /><strong>▶ Run Tests</strong> to
              see results.
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Hidden iframe for sandboxed test execution -->
    <iframe id="test-frame" sandbox="allow-scripts allow-same-origin"></iframe>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
