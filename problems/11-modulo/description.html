<p>Write a recursive function that returns the remainder of <code>x</code> divided by <code>y</code> without using the modulo operator.</p>
<p>For example, <code>modulo(5, 2)</code> should return <code>1</code>, <code>modulo(17, 5)</code> should return <code>2</code>, and <code>modulo(22, 6)</code> should return <code>4</code>.</p>
