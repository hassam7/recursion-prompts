<p>Write a recursive function that forces an array of numbers to alternate between positive and negative values.</p>
<p>The first value should always be positive, regardless of the original sign. For example, <code>alternateSign([-2, -7, 8, 3, -1, 4])</code> should return <code>[2, -7, 8, -3, 1, -4]</code>.</p>
