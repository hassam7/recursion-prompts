<p>Write a recursive function that returns every permutation of a string.</p>
<p>The order of the returned permutations does not matter. For example, <code>permutations('abc')</code> should include <code>'abc'</code>, <code>'acb'</code>, <code>'bac'</code>, <code>'bca'</code>, <code>'cab'</code>, and <code>'cba'</code>.</p>
