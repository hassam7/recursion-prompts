<p>Write a recursive function that counts how many times a target value appears in an array.</p>
<p>For example, <code>countOccurrence([2, 7, 4, 4, 1, 4], 4)</code> should return <code>3</code>, and <code>countOccurrence([2, 'banana', 4, 4, 1, 'banana'], 'banana')</code> should return <code>2</code>.</p>
