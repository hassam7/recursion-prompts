<p>Write a recursive function that returns the Fibonacci number at index <code>n</code>.</p>
<p>For example, using the sequence <code>[0, 1, 1, 2, 3, 5, 8, 13, 21]</code>, <code>nthFibo(5)</code> should return <code>5</code>, <code>nthFibo(7)</code> should return <code>13</code>, and <code>nthFibo(3)</code> should return <code>2</code>.</p>
