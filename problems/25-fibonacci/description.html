<p>Write a recursive function that returns the first <code>n</code> Fibonacci numbers.</p>
<p>In the Fibonacci sequence, each number is the sum of the two numbers before it. For example, <code>fibonacci(5)</code> should return <code>[0, 1, 1, 2, 3, 5]</code>. The starting <code>0</code> is included in the output but does not count toward <code>n</code>.</p>
