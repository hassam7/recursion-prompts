<p>Write a recursive function that removes consecutive duplicate values from an array.</p>
<p>Only collapse values that appear next to each other. For example, <code>compress([1, 2, 2, 3, 4, 4, 5, 5, 5])</code> should return <code>[1, 2, 3, 4, 5]</code>, while separated duplicates should remain.</p>
