<p>Write a recursive function that generates every valid arrangement of <code>n</code> pairs of parentheses.</p>
<p>Only include balanced combinations. For example, <code>generateParentheses(3)</code> should include <code>'((()))'</code>, <code>'(()())'</code>, <code>'(())()'</code>, <code>'()(())'</code>, and <code>'()()()'</code>.</p>
